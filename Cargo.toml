[package]
name = "opencode-memory"
version = "0.6.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
description = "Shared native zvec-backed project memory daemon for OpenCode plugins"
repository = "https://github.com/nguyenthdat/opencode-native-memory"
readme = "README.md"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]
cuda-no-vmm = ["llama-cpp-2/cuda-no-vmm"]
metal = ["llama-cpp-2/metal"]
openmp = ["llama-cpp-2/openmp"]
static-openmp = ["llama-cpp-2/static-openmp"]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
anyhow = "1.0"
fs2 = "0.4"
hex = "0.4"
hf-hub = { version = "=1.0.0", features = ["blocking"] }
ignore = "0.4.31"
llama-cpp-2 = { version = "=0.1.153", default-features = false }
prost = "=0.14.4"
regex = "=1.12.3"
self_cell = "=1.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
unicode-normalization = "0.1"
rustix = { version = "1.1", features = ["fs", "process"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
xberg = { version = "=1.0.3", default-features = false, features = ["tokio-runtime", "simd-utf8", "pdf"] }
zvec-rust = "=0.6.0"
keyhog-core = "=0.5.44"
keyhog-scanner = { version = "=0.5.44", default-features = false, features = ["ml", "entropy", "decode", "multiline"] }
keyhog-sources = { version = "=0.5.44", default-features = false }
guardrail-core = "=0.1.1"
guardrail-classifiers = { version = "=0.1.1", features = ["onnx"] }
oxigraph = { version = "=0.5.9", default-features = false }

[patch.crates-io]
keyhog-scanner = { path = "vendor/keyhog-scanner" }
xberg = { path = "vendor/xberg/crates/xberg" }

[build-dependencies]
prost-build = "=0.14.4"

[dev-dependencies]
tempfile = "3"

[lints]
rust.unsafe_code = "forbid"
clippy.correctness = "deny"
clippy.suspicious = "warn"
clippy.complexity = "warn"
clippy.perf = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
